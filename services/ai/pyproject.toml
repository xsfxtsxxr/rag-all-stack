[tool.poetry]
name = "rag-ai-service"
version = "0.1.0"
description = "rag-all-stack AI 服务（精简版）：Word 解析、fastembed 向量化、pgvector 检索与问答"
authors = ["rag-all-stack"]
packages = [{ include = "app" }]

[tool.poetry.dependencies]
# 目标解释器 3.13（Docker 构建）；本地开发兼容 3.12
python = ">=3.12,<3.14"
fastapi = ">=0.115.0,<1.0.0"
uvicorn = { extras = ["standard"], version = ">=0.32.0,<1.0.0" }
pydantic = ">=2.9.0,<3.0.0"
pydantic-settings = ">=2.5.0,<3.0.0"
fastembed = ">=0.4.0,<1.0.0"
python-docx = ">=1.1.0,<2.0.0"
psycopg = { extras = ["binary"], version = ">=3.2.0,<4.0.0" }
psycopg-pool = ">=3.2.0,<4.0.0"
httpx = ">=0.27.0,<1.0.0"

[tool.poetry.group.dev.dependencies]
pytest = ">=8.3.0,<10.0.0"
pytest-asyncio = ">=0.24.0,<2.0.0"
mypy = ">=1.13.0,<3.0.0"
ruff = ">=0.8.0,<1.0.0"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "TID"]

[tool.ruff.lint.per-file-ignores]
# FastAPI 的 File(...)/Form(...) 默认参数属于框架惯用法
"app/routers/*.py" = ["B008"]

[tool.mypy]
strict = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"
