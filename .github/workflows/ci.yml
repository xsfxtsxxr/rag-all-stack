name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  node:
    name: Node (lint / typecheck / test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

  python:
    name: Python (ruff / mypy / pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/ai
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: poetry
      - name: Install Poetry
        run: python -m pip install poetry==2.4.1
      # 精简版无 torch 等重依赖（fastembed/ONNX），安装较快
      - name: Install dependencies
        run: poetry install --with dev --no-root
      - name: Ruff
        run: poetry run ruff check . && poetry run ruff format --check .
      - name: Mypy
        run: poetry run mypy app tests
      - name: Pytest
        run: poetry run pytest
